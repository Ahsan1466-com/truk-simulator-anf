<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>TRUK INDONESIA SIMULATOR — NMR71</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#87ceeb;font-family:Arial,sans-serif}#game{position:fixed;inset:0}canvas{display:block}#hud{position:fixed;left:12px;top:12px;z-index:10;color:#fff;text-shadow:0 2px 4px #000;font-weight:bold}.panel{background:rgba(0,0,0,.48);border:1px solid rgba(255,255,255,.25);border-radius:12px;padding:9px 12px;margin-bottom:8px;backdrop-filter:blur(4px)}#title{font-size:18px}#stats{font-size:13px;line-height:1.55}#mission{max-width:310px;font-size:13px}#help{position:fixed;right:12px;top:12px;z-index:10;color:white;text-align:right;font-size:12px}#buttons{position:fixed;left:0;right:0;bottom:12px;z-index:20;display:flex;justify-content:space-between;padding:0 14px;pointer-events:none}.pad{display:grid;grid-template-columns:64px 64px 64px;grid-template-rows:64px 64px;gap:7px;pointer-events:auto}.btn{border:1px solid rgba(255,255,255,.3);background:rgba(0,0,0,.5);color:#fff;border-radius:14px;font-size:25px;font-weight:bold;touch-action:none;user-select:none}.btn:active{background:rgba(255,180,0,.65)}.actions{display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:auto}.actions .btn{font-size:14px;padding:0 16px;min-width:135px}#loading{position:fixed;inset:0;z-index:50;background:#111;color:#fff;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px}#bar{width:min(380px,80vw);height:8px;background:#333;border-radius:9px;overflow:hidden}#bar>i{display:block;width:0;height:100%;background:#ffcc00}@media(max-width:700px){#help{display:none}#title{font-size:15px}.panel{padding:7px 9px}.pad{grid-template-columns:58px 58px 58px;grid-template-rows:58px 58px}.btn{font-size:22px}.actions .btn{min-width:120px}}</style></head><body>
<div id="game"></div><div id="loading"><b style="font-size:22px">TRUK INDONESIA SIMULATOR</b><div id="bar"><i></i></div><div id="loadText">Memuat truk...</div><small>Model NMR71 dari proyek kamu</small></div>
<div id="hud"><div class="panel" id="title">🚚 TRUK INDONESIA SIMULATOR</div><div class="panel" id="stats">Kecepatan: <span id="speed">0</span> km/j<br>Muatan: <span id="cargo">Kosong</span><br>Stabilitas: <span id="stab">100</span>%</div><div class="panel" id="mission">📦 Misi: bawa muatan melewati jalan desa.</div></div>
<div id="help" class="panel">W/S atau ↑/↓ = gas/rem<br>A/D atau ←/→ = belok<br>SPACE = rem tangan • M = muatan</div>
<div id="buttons"><div class="pad"><button class="btn" id="left">◀</button><button class="btn" id="up">▲</button><button class="btn" id="right">▶</button><span></span><button class="btn" id="down">▼</button><span></span></div><div class="actions"><button class="btn" id="cargoBtn">📦 MUATAN: KOSONG</button><button class="btn" id="resetBtn">↻ RESET TRUK</button></div></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.128.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';import{OBJLoader}from'three/addons/loaders/OBJLoader.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x87ceeb);scene.fog=new THREE.Fog(0x87ceeb,90,420);const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,1000);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;document.getElementById('game').appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xbfe9ff,0x6b4b2a,1.35));const sun=new THREE.DirectionalLight(0xffffff,1.5);sun.position.set(-80,120,60);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
const mat=c=>new THREE.MeshStandardMaterial({color:c,roughness:.85}),road=mat(0x343434),grass=mat(0x4d9a43),shoulder=mat(0xbda97d),rice=mat(0x83bd4e),water=mat(0x5da8d0),white=mat(0xf0f0f0),red=mat(0xc83b2f),wood=mat(0x8a542f),roof=mat(0x9c3d2c),green=mat(0x2d8b3f);
function box(w,h,d,m,x,y,z,r=0,p=scene){let q=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);q.position.set(x,y,z);q.rotation.y=r;q.castShadow=true;q.receiveShadow=true;p.add(q);return q}function cyl(r,h,m,x,y,z,p=scene){let q=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,12),m);q.position.set(x,y,z);q.castShadow=true;p.add(q);return q}
function tree(x,z,s=1){let g=new THREE.Group;g.position.set(x,0,z);scene.add(g);cyl(.22*s,2.2*s,wood,0,1.1,0,g);let c=new THREE.Mesh(new THREE.SphereGeometry(1.25*s,12,8),green);c.position.y=2.5*s;c.castShadow=true;g.add(c)}function palm(x,z,s=1){let g=new THREE.Group;g.position.set(x,0,z);scene.add(g);cyl(.16*s,3.4*s,wood,0,1.7*s,0,g);for(let i=0;i<7;i++){let a=i*Math.PI*2/7;let q=box(.12*s,2*s,.25*s,green,Math.sin(a)*.75*s,3.45*s,Math.cos(a)*.75*s,a,g);q.rotation.z=.8}}
function house(x,z,r=0){let g=new THREE.Group;g.position.set(x,0,z);g.rotation.y=r;scene.add(g);box(5,2.6,4,white,0,1.3,0,0,g);box(5.5,.6,4.5,roof,0,2.85,0,0,g);box(1,1.5,.12,red,0,1,-2.05,0,g);box(.9,1.5,.12,water,1.5,1,-2.05,0,g)}function warung(x,z){let g=new THREE.Group;g.position.set(x,0,z);scene.add(g);box(4,2.4,3.5,wood,0,1.2,0,0,g);box(4.5,.55,4,roof,0,2.65,0,0,g);box(4.1,.7,.15,red,0,1.9,-1.8,0,g)}
function terrain(){box(260,.35,650,grass,0,-.2,-230);box(9,.18,650,road,0,.02,-230);box(2,.22,650,shoulder,-5.5,.03,-230);box(2,.22,650,shoulder,5.5,.03,-230);for(let z=20;z>-550;z-=12)box(.12,.025,6,mat(0xf5e5a0),0,.13,z);for(let z=0;z>-520;z-=45)for(let x of[-22,22]){box(22,.08,36,rice,x,.03,z);box(21,.05,1.8,water,x,.08,z+10);box(21,.05,1.8,water,x,.08,z-10)}for(let z=5;z>-540;z-=28){if(((z/28)|0)%2===0){tree(-12,z,1);palm(14,z-8,.9)}else{palm(-13,z,.9);tree(12,z,1.1)}if(z>-280){house(-18,z-8,Math.PI/2);if(z%56===0)warung(18,z+5)}}for(let i=-4;i<=4;i++){let h=35+Math.random()*25,q=new THREE.Mesh(new THREE.ConeGeometry(55,h,6),mat(0x54795b));q.position.set(i*65,h/2-0.1,-350);scene.add(q)}}terrain();
const truck=new THREE.Group;scene.add(truck);let cargoGroup=new THREE.Group;scene.add(cargoGroup);function cargo(){cargoGroup.clear();let cs=[0xd39b44,0x6b7e8d,0x9e5b3c,0xc6c6c6];for(let i=0;i<8;i++)box(1.7,1,1.4,mat(cs[i%4]),((i%4)-1.5)*1.75,3.1,-.8-Math.floor(i/4)*1.55,0,cargoGroup);cargoGroup.visible=false}cargo();
new OBJLoader().load('NMR71 UPDATE.proj',obj=>{obj.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;let n=(o.name||'').toLowerCase();o.material=mat(n.includes('cylinder')||n.includes('wheel')?0x202020:0x43a82d)}});let b=new THREE.Box3().setFromObject(obj),s=b.getSize(new THREE.Vector3()),c=b.getCenter(new THREE.Vector3());obj.position.sub(c);obj.scale.setScalar(6.8/Math.max(s.x,s.z));obj.rotation.y=Math.PI/2;truck.add(obj);document.getElementById('bar').firstElementChild.style.width='100%';document.getElementById('loadText').textContent='Siap! Tekan gas.';setTimeout(()=>document.getElementById('loading').style.display='none',500)},x=>{if(x.total)document.getElementById('bar').firstElementChild.style.width=Math.min(95,x.loaded/x.total*100)+'%'},e=>{document.getElementById('loadText').textContent='Model gagal dimuat. Pastikan OBJ satu folder dengan HTML.'});
const st={p:new THREE.Vector3(0,0,0),h:0,v:0,s:0,t:0,c:0,stab:100};const keys={};onkeydown=e=>{keys[e.key.toLowerCase()]=true;if(e.code==='Space')keys.space=true;if(e.key.toLowerCase()==='m')toggle()};onkeyup=e=>{keys[e.key.toLowerCase()]=false;if(e.code==='Space')keys.space=false};function bind(id,k){let b=document.getElementById(id);b.onpointerdown=e=>{e.preventDefault();keys[k]=true};b.onpointerup=b.onpointercancel=b.onpointerleave=e=>{keys[k]=false}}bind('left','a');bind('right','d');bind('up','w');bind('down','s');function toggle(){st.c=(st.c+1)%3;cargoGroup.visible=st.c>0;let n=['Kosong','4 ton','8 ton'][st.c];document.getElementById('cargo').textContent=n;document.getElementById('cargoBtn').textContent='📦 MUATAN: '+n.toUpperCase()}document.getElementById('cargoBtn').onclick=toggle;document.getElementById('resetBtn').onclick=()=>{st.p.set(0,0,0);st.h=st.v=st.t=0};
let last=performance.now();function update(dt){let th=(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0),sr=(keys.a||keys.arrowleft?-1:0)+(keys.d||keys.arrowright?1:0),mass=[0,4,8][st.c];if(th>0)st.v+=(10-mass*.55)*dt;if(th<0)st.v-=13*dt;st.v*=Math.pow(.992,dt*60);if(keys.space)st.v*=Math.pow(.94,dt*60);st.v=THREE.MathUtils.clamp(st.v,-7,28-mass*.8);st.s=THREE.MathUtils.lerp(st.s,sr,.15);st.h-=1.25/(1+Math.abs(st.v)*.055)*st.s*dt*(st.v>=0?1:-1);let f=new THREE.Vector3(Math.sin(st.h),0,Math.cos(st.h));st.p.addScaledVector(f,st.v*dt);st.p.x=THREE.MathUtils.clamp(st.p.x,-4.4,4.4);st.t=THREE.MathUtils.lerp(st.t,-st.s*(Math.abs(st.v)/28)*(.16+mass*.025),.08);let stress=Math.min(100,Math.abs(st.t)*170+Math.abs(st.v)*.4+mass*1.5);st.stab=Math.round(THREE.MathUtils.clamp(100-stress,0,100));let bounce=Math.sin(performance.now()*.009+st.p.z*.5)*Math.min(.06,Math.abs(st.v)*.0018);truck.position.set(st.p.x,1.35+bounce,st.p.z);truck.rotation.set(0,st.h,st.t);cargoGroup.position.copy(truck.position);cargoGroup.rotation.copy(truck.rotation);document.getElementById('speed').textContent=Math.round(Math.abs(st.v)*3.6);document.getElementById('stab').textContent=st.stab;document.getElementById('mission').textContent=st.stab<35?'⚠️ Truk mulai oleng! Kurangi gas.':'📦 Misi: bawa muatan melewati jalan desa.'}
function cam(dt){let f=new THREE.Vector3(Math.sin(st.h),0,Math.cos(st.h)),d=st.p.clone().addScaledVector(f,-12).add(new THREE.Vector3(0,6,0));camera.position.lerp(d,1-Math.pow(.001,dt));camera.lookAt(st.p.clone().addScaledVector(f,7).add(new THREE.Vector3(0,1.5,0)))}function loop(t){requestAnimationFrame(loop);let dt=Math.min(.035,(t-last)/1000);last=t;update(dt);cam(dt);renderer.render(scene,camera)}loop(performance.now());onresize=()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)};
</script></body></html>
